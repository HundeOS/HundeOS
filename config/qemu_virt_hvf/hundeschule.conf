# driver <path> [once|respawn]
# virtio-block-driver <device-path> <driver-path>
virtio-block-driver /dev/virtio4 /sbin/drivers/virtio_blk_channelio
virtio-block-driver /dev/virtio5 /sbin/drivers/virtio_blk_channelio
virtio-block-driver /dev/virtio6 /sbin/drivers/virtio_blk_channelio
driver /sbin/drivers/hundebus once
driver /sbin/services/hundekanal-test-echo once
driver /sbin/drivers/socket_router once
driver /sbin/drivers/uart_rx respawn
driver /sbin/drivers/uart_tx respawn
