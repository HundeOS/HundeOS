# driver <path> [once|respawn]
driver /sbin/drivers/video_term once
# virtio-block-driver <device-path> <driver-path>
virtio-block-driver /dev/virtio4 /sbin/drivers/virtio_blk_channelio
driver /sbin/drivers/hundebus once
driver /sbin/drivers/sdhci_channelio once
driver /sbin/drivers/virtio_keyboard respawn
