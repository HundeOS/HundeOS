# kind       endpoint or format   trusted component image
service socket_router /sbin/components/socket.wuff
service network /sbin/components/network.wuff
service hund-rohr /sbin/components/pipe.wuff
filesystem boot-config /sbin/components/ext2fs.wuff
filesystem ext2.wuff /sbin/components/ext2fs.wuff
filesystem fat32.wuff /sbin/components/fat32.wuff
driver uart_rx /sbin/components/uart_rx.wuff
driver uart_tx /sbin/components/uart_tx.wuff
driver virtio_blk /sbin/components/virtio_blk.wuff
driver virtio_keyboard /sbin/components/virtio_keyboard.wuff
driver sdhci /sbin/components/sdhci.wuff
polled-driver net-dummy /sbin/components/net_dummy.wuff
virtio-driver 1 ethernet /sbin/components/virtio_net.wuff
