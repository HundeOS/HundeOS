[package]
name = "hunde-network"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "network-component"
path = "src/entry.rs"
required-features = ["component"]

[features]
component = []

[dependencies]
hunde = { path = "../../lib/hunde" }
smoltcp = { version = "=0.14.0", default-features = false, features = ["alloc", "medium-ip", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-reno"] }

[lints]
workspace = true
