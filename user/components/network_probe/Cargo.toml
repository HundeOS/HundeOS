[package]
name = "hunde-network-probe"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
executable = []

[dependencies]
hunde = { path = "../../lib/hunde" }
hunde-network = { path = "../../services/hunde-network" }
heapless = "=0.9.3"
smoltcp = { version = "=0.14.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-ipv6", "proto-ipv6-slaac", "socket-tcp", "socket-tcp-reno", "socket-udp", "socket-icmp", "socket-dhcpv4", "socket-dns", "auto-icmp-echo-reply"] }

[lints]
workspace = true
