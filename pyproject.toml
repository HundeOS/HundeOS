[project]
name = "hundeos-kernel-tools"
version = "0.1.0"
description = "Python tooling for the HundeOS kernel experiment."
requires-python = ">=3.12"
dependencies = [
    "bashlex==0.18",
    "clang-format==22.1.0",
    "compiledb==0.10.7",
    "pyyaml",
    "pytest",
    "tree-sitter",
    "tree-sitter-c",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test/tools"]
pythonpath = ["tools"]
